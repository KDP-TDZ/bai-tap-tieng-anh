<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Chọn khóa học</title>
  <style>
    /* Toàn bộ CSS đặt ở đây – bạn có thể tùy chỉnh */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      perspective: 1000px;
    }

    /* ===== HIỆU ỨNG 3D NỀN (các khối lập phương xoay) ===== */
    .cube {
      position: absolute;
      width: 80px;
      height: 80px;
      transform-style: preserve-3d;
      animation: spin 12s infinite linear;
      opacity: 0.15;
    }
    .cube div {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.05);
    }
    .front  { transform: translateZ(40px); }
    .back   { transform: rotateY(180deg) translateZ(40px); }
    .left   { transform: rotateY(-90deg) translateZ(40px); }
    .right  { transform: rotateY(90deg) translateZ(40px); }
    .top    { transform: rotateX(90deg) translateZ(40px); }
    .bottom { transform: rotateX(-90deg) translateZ(40px); }

    @keyframes spin {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(360deg); }
    }
    .cube1 { top: 10%; left: 10%; animation-duration: 14s; }
    .cube2 { bottom: 15%; right: 12%; animation-duration: 18s; animation-direction: reverse; }
    .cube3 { top: 60%; left: 70%; animation-duration: 20s; }
    .cube4 { bottom: 20%; left: 20%; animation-duration: 16s; animation-direction: reverse; }
    .cube5 { top: 5%; right: 30%; animation-duration: 22s; }

    /* ===== KHUNG LOGIN 3D ===== */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 3rem 2.5rem;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                  inset 0 1px 0 rgba(255,255,255,0.1);
      transform: rotateY(2deg) rotateX(2deg);
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }
    .login-card:hover {
      transform: rotateY(0deg) rotateX(0deg) translateY(-5px);
      box-shadow: 0 35px 60px -15px rgba(0,0,0,0.6), 
                  inset 0 1px 0 rgba(255,255,255,0.2);
    }

    h2 {
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    p.subtitle {
      color: rgba(255,255,255,0.7);
      text-align: center;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      background-color: rgba(255,255,255,0.08);
    }
    input::placeholder {
      color: rgba(255,255,255,0.45);
    }
    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }
    select option {
      background: #1e293b;
      color: #fff;
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(56,189,248,0.4);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(56,189,248,0.6);
    }
    .btn-login:active {
      transform: translateY(0);
    }

    .error-msg {
      color: #fda4af;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
      text-align: center;
    }
    .error-msg.show { display: block; }

    /* Responsive nhẹ */
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem; }
      h2 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <!-- Các khối lập phương nền -->
  <div class="cube cube1"><div class="front"></div><div class="back"></div><div class="left"></div><div class="right"></div><div class="top"></div><div class="bottom"></div></div>
  <div class="cube cube2"><div class="front"></div><div class="back"></div><div class="left"></div><div class="right"></div><div class="top"></div><div class="bottom"></div></div>
  <div class="cube cube3"><div class="front"></div><div class="back"></div><div class="left"></div><div class="right"></div><div class="top"></div><div class="bottom"></div></div>
  <div class="cube cube4"><div class="front"></div><div class="back"></div><div class="left"></div><div class="right"></div><div class="top"></div><div class="bottom"></div></div>
  <div class="cube cube5"><div class="front"></div><div class="back"></div><div class="left"></div><div class="right"></div><div class="top"></div><div class="bottom"></div></div>

  <!-- Thẻ đăng nhập -->
  <div class="login-card">
    <h2>🎓 Học viện</h2>
    <p class="subtitle">Đăng nhập để chọn khóa học của bạn</p>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" placeholder="Nhập username" required>
      </div>
      <div class="input-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
      </div>
      <div class="input-group">
        <label for="course">Chọn khóa học</label>
        <select id="course" required>
          <option value="">-- Đang tải danh sách... --</option>
        </select>
      </div>
      <button type="submit" class="btn-login">Đăng nhập & Vào học</button>
      <p id="errorMsg" class="error-msg"></p>
    </form>
  </div>

  <script>
    (async function() {
      // Lấy danh sách khóa học từ courses.json
      const courseSelect = document.getElementById('course');
      try {
        const response = await fetch('courses.json');
        if (!response.ok) throw new Error('Không thể tải danh sách khóa học');
        const courses = await response.json();
        courseSelect.innerHTML = '<option value="">-- Chọn khóa học --</option>';
        courses.forEach(course => {
          const option = document.createElement('option');
          option.value = course.file;
          option.textContent = course.name;
          courseSelect.appendChild(option);
        });
      } catch (err) {
        courseSelect.innerHTML = '<option value="">Lỗi tải danh sách, kiểm tra courses.json</option>';
        console.error(err);
      }

      // Xử lý đăng nhập
      const form = document.getElementById('loginForm');
      const errorMsg = document.getElementById('errorMsg');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const selectedFile = courseSelect.value;

        // Kiểm tra rỗng
        if (!username || !password || !selectedFile) {
          errorMsg.textContent = 'Vui lòng điền đầy đủ thông tin và chọn khóa học.';
          errorMsg.classList.add('show');
          return;
        }

        // Ở đây bạn có thể thêm logic kiểm tra username/password thực tế
        // Ví dụ cứng: admin / 123456
        if (username === 'admin' && password === '123456') {
          // Chuyển hướng đến trang khóa học
          window.location.href = selectedFile;
        } else {
          errorMsg.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.';
          errorMsg.classList.add('show');
        }
      });
    })();
  </script>
</body>
</html>
